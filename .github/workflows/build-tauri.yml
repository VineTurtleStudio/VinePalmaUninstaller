name: Build VinePalma Uninstaller (Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  APP_NAME: VinePalmaUninstaller

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # LINUX 构建 —— 原生 ubuntu 运行器（不用 Docker，更稳定）
  # 卸载器依赖 apt/dpkg/pkexec 等 Linux 生态，仅支持 deb/appimage
  # ============================================================
  build-linux:
    name: Linux - ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # --- x86_64：在 ubuntu 运行器上原生编译，只需宿主链接库 ---
      - name: Install Linux dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      # --- aarch64：交叉编译，需安装 ARM 链接器与 ARM64 依赖库 ---
      - name: Install Linux cross-compile dependencies (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 librsvg2-dev:arm64 \
            patchelf

      - name: Configure Cargo for aarch64 cross-compile
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_target }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (deb + appimage)
        run: npm run tauri build -- --target ${{ matrix.rust_target }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VinePalmaUninstaller-Linux-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/
          if-no-files-found: error